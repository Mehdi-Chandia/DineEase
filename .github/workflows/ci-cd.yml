name: dineEase ci cd pipeline

on:
   push:
        branches:
          - main


jobs:
  check-backend:
    runs-on: ubuntu-latest
    steps:
      - name: get the code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version:
                        "24"
      - name: install deps
        working-directory: ./backend                  
        run: npm install


  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: get the code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
             node-version:
                          "24"
      - name: install deps
        working-directory: ./frontend 
        run: npm install

      - name: build frontend 
        working-directory: ./frontend
        run: npm run build


  docker:
    runs-on: ubuntu-latest
    needs: [check-backend, check-frontend]
    steps:
      - name: get the code 
        uses: actions/checkout@v4

      - name: login to docker
        uses: docker/login-action@v3
        with:
           username: ${{secrets.DOCKER_USERNAME}}
           password: ${{secrets.DOCKER_PASSWORD}}

      - name: build and push backend image
        run: |
            docker build -t ${{secrets.DOCKER_USERNAME}}/dineease-backend:latest ./backend
            docker push ${{secrets.DOCKER_USERNAME}}/dineease-backend:latest

      - name: build and push frontend image
        run: |
            docker build -t ${{secrets.DOCKER_USERNAME}}/dineease-frontend:latest ./frontend
            docker push ${{secrets.DOCKER_USERNAME}}/dineease-frontend:latest