services:
  

  backend:
    build: ./backend
    container_name: dineEase-backend
    ports:
      - 5000:5000
    environment:
      - PORT=5000
    env_file:
      - ./backend/.env


  frontend:
    build: ./frontend
    container_name: dineEase-frontend
    ports:
      - 80:80
    depends_on: 
      - backend